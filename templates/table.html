<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Таблица книг</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 4.2 -->
  <h1>Все книги таблицей</h1>
  <table class="table">
    <tr>
      <th>№</th><th>Название</th><th>Автор</th><th>Год</th><th>Жанры</th>
    </tr>
    {% for book in books %}
      <tr class="{{ loop.cycle('odd', 'even') }}">
        <td>{{ loop.index }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.year }}</td>
        <td>{{ book.genres | join(", ") }}</td>
      </tr>
    {% endfor %}
  </table>

  <!-- 4.3 -->
  <p>Всего книг: {{ books | length }}</p>
</body>
</html>
