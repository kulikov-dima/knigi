{% extends "base.html" %}

{% block title %}Классика — Книжная полка{% endblock %}

{% block content %}
  <h1>Книги, изданные до 1950 года</h1>
  <ul>
    {% for book in books if book.year < 1950 %}
      <li>
        <a href="{{ url_for('book', book_id=book.id) }}">{{ book.title }}</a>
        — {{ book.author }} ({{ book.year }})
      </li>
    {% endfor %}
  </ul>
{% endblock %}
