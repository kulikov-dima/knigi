<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Классика</title>
  <!-- 5.4 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- 5.5 — меню (пока копия в каждом шаблоне) -->
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="{{ 'current' if active == 'index' else '' }}">Карточки</a>
    <a href="{{ url_for('table') }}" class="{{ 'current' if active == 'table' else '' }}">Таблица</a>
    <a href="{{ url_for('about') }}" class="{{ 'current' if active == 'about' else '' }}">О сайте</a>
  </nav>

  <h1>Книги, изданные до 1950 года</h1>
  <ul>
    {% for book in books if book.year < 1950 %}
      <li>
        <a href="{{ url_for('book', book_id=book.id) }}">{{ book.title }}</a>
        — {{ book.author }} ({{ book.year }})
      </li>
    {% endfor %}
  </ul>
</body>
</html>
