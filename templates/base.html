<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжная полка{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="{{ url_for('index') }}">📚 Книжная полка</a>
    <a href="{{ url_for('index') }}" class="{{ 'current' if active == 'index' else '' }}">Карточки</a>
    <a href="{{ url_for('table') }}" class="{{ 'current' if active == 'table' else '' }}">Таблица</a>
    <a href="{{ url_for('classic') }}" class="{{ 'current' if active == 'classic' else '' }}">Классика</a>
    <a href="{{ url_for('about') }}" class="{{ 'current' if active == 'about' else '' }}">О сайте</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">{% block footer %}Учебный проект{% endblock %}</footer>
</body>
</html>
