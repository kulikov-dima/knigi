<article class="card">
  <h3 class="{{ 'top' if book.rating is defined and book.rating >= 4.5 else '' }}">
    <a href="{{ url_for('book', book_id=book.id) }}">{{ book.title }}</a>
  </h3>
  <p class="muted">{{ book.author }}, {{ book.year }}</p>

  {% if book.rating is defined %}
    <p>Рейтинг: {{ book.rating }}</p>
  {% else %}
    <p class="muted">Нет оценки</p>
  {% endif %}

  <p>
    {% for genre in book.genres %}
      <a class="tag" href="{{ url_for('index', genre=genre) }}">{{ genre }}</a>
    {% else %}
      <span class="muted">Жанр не указан</span>
    {% endfor %}
  </p>
</article>
